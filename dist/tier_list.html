    const TIER_HEADERS = {
      'S': { label: 'S', sub: '최상급 난이도 (전멸 주의)' },
      'A': { label: 'A', sub: '상급 난이도 (위험 패턴)' },
      'B': { label: 'B', sub: '표준 난이도 (패링/회피)' },
      'C': { label: 'C', sub: '수월한 난이도' }
    };

    function renderTierMatrix() {
      const matrix = document.getElementById('tierMatrix');
      matrix.innerHTML = '';

      ['S', 'A', 'B', 'C'].forEach(tierKey => {
        const list = TIER_DATA[tierKey] || [];
        const info = TIER_HEADERS[tierKey];

        const row = document.createElement('section');
        row.className = 'tier-row';

        const head = document.createElement('div');
        head.className = `tier-head ${tierKey.toLowerCase()}`;
        head.innerHTML = `
          <div class="tier-letter">${info.label}</div>
          <div class="tier-sub">${info.sub}</div>
          <div style="font-size:11px; color:#8b949e; margin-top:4px;">(${list.length}마리)</div>
        `;

        const itemsZone = document.createElement('div');
        itemsZone.className = 'tier-items';

        list.forEach(m => {
          const card = document.createElement('div');
          card.className = 'm-card';
          card.innerHTML = `
            ${m.youtubeId ? '<span class="video-badge" title="클릭 시 유튜브 공략 영상 재생">🎬 영상</span>' : ''}
            <img src="${m.image}" alt="${m.name}" class="m-thumb" loading="lazy">
            <div class="m-name" title="${m.name}">${m.name}</div>
            <div class="m-meta">${m.floor} · ${m.grade}</div>
          `;
          card.addEventListener('click', () => openModal(m));
          itemsZone.appendChild(card);
        });

        row.appendChild(head);
        row.appendChild(itemsZone);
        matrix.appendChild(row);
      });
    }

    function openModal(m) {
      const modal = document.getElementById('modalBackdrop');
      const content = document.getElementById('modalContent');

      let videoHtml = '';
      if (m.youtubeId) {
        videoHtml = `
          <div class="video-container">
            <iframe src="https://www.youtube-nocookie.com/embed/${m.youtubeId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
          </div>
        `;
      }

      content.innerHTML = `
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
          <img src="${m.image}" alt="${m.name}" style="width:64px; height:64px; object-fit:contain; image-rendering:pixelated; background:#0b0e14; border-radius:6px; border:1px solid #30363d;">
          <div>
            <h2 style="font-size:18px; color:#fff; font-weight:800; margin:0;">${m.name}</h2>
            <div style="color:#8b949e; font-size:12px; margin-top:4px;">출현지: ${m.floor} · 등급: ${m.grade}</div>
          </div>
        </div>
        ${videoHtml}
        <p style="color:#c9d1d9; font-size:13px; line-height:1.6; margin-top:12px;">${m.intro}</p>
        <div style="margin-top:16px; display:flex; justify-content:flex-end;">
          <a href="./index.html?search=${encodeURIComponent(m.name)}" class="nav-btn" style="background:#238636; color:#fff; border:none; padding:8px 16px; border-radius:6px; text-decoration:none; font-weight:700;">💎 드롭 룬 도감 검색</a>
        </div>
      `;

      modal.style.display = 'flex';
    }

    function closeModal(e) {
      if (!e || e.target.id === 'modalBackdrop' || e.target.classList.contains('modal-close')) {
        const modal = document.getElementById('modalBackdrop');
        const content = document.getElementById('modalContent');
        content.innerHTML = '';
        modal.style.display = 'none';
      }
    }

    // Clean up any legacy localStorage edit key
    try {
      localStorage.removeItem('brimir_g4_tier_order');
      localStorage.removeItem('brimir_g4_tier_order_v2');
      localStorage.removeItem('brimir_g4_tier_order_v3');
    } catch (e) {}

    renderTierMatrix();
  </script>

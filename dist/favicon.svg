<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="70%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Outer Aura Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Crystal Facet Gradients -->
    <!-- Top Apex -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5d6ff" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>

    <!-- Left Flank (Purple Mysticism) -->
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d2a8ff" />
      <stop offset="100%" stop-color="#8957e5" />
    </linearGradient>

    <!-- Right Flank (Deep Azure) -->
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>

    <!-- Center Core (Radiant Star Light) -->
    <linearGradient id="coreLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#7ee787" />
      <stop offset="100%" stop-color="#f2cc60" />
    </linearGradient>

    <!-- Bottom Point -->
    <linearGradient id="facetBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2cc60" />
      <stop offset="100%" stop-color="#d29922" />
    </linearGradient>
  </defs>

  <!-- Dark Shield Base with Neon Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#30363d" stroke-width="12" />
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#58a6ff" stroke-width="4" stroke-opacity="0.4" filter="url(#glow)" />

  <!-- Outer Runic Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#bc8cff" stroke-width="3" stroke-dasharray="16 12 6 12" stroke-opacity="0.5" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#58a6ff" stroke-width="2" stroke-opacity="0.3" />

  <!-- Outer Crystal Aura -->
  <polygon points="256,70 396,180 396,332 256,442 116,332 116,180" fill="#58a6ff" fill-opacity="0.2" filter="url(#superGlow)" />

  <!-- Main Octagonal Crystal Body -->
  <!-- Top Facet Triangle -->
  <polygon points="256,90 320,190 192,190" fill="url(#facetTop)" />

  <!-- Left Upper Facet -->
  <polygon points="192,190 256,90 136,190" fill="url(#facetLeft)" />
  
  <!-- Right Upper Facet -->
  <polygon points="320,190 256,90 376,190" fill="url(#facetRight)" />

  <!-- Center Hexagonal Table/Core -->
  <polygon points="192,190 320,190 360,280 256,340 152,280" fill="url(#coreLight)" fill-opacity="0.95" filter="url(#glow)" />

  <!-- Left Middle Wing -->
  <polygon points="136,190 192,190 152,280 120,270" fill="url(#facetLeft)" />

  <!-- Right Middle Wing -->
  <polygon points="376,190 320,190 360,280 392,270" fill="url(#facetRight)" />

  <!-- Bottom Lower Left Facet -->
  <polygon points="152,280 256,340 256,422" fill="url(#facetLeft)" />

  <!-- Bottom Lower Right Facet -->
  <polygon points="360,280 256,340 256,422" fill="url(#facetBottom)" />

  <!-- Ancient Rune Core Inscription (Nexus Cross / Star) -->
  <g filter="url(#glow)">
    <!-- Vertical Light Ray -->
    <line x1="256" y1="130" x2="256" y2="390" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <!-- Horizontal Light Ray -->
    <line x1="160" y1="240" x2="352" y2="240" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <!-- Diagonal Cross -->
    <line x1="196" y1="180" x2="316" y2="300" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="316" y1="180" x2="196" y2="300" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <!-- Radiant Core Diamond -->
    <polygon points="256,215 281,240 256,265 231,240" fill="#ffffff" />
    <circle cx="256" cy="240" r="5" fill="#f2cc60" />
  </g>

  <!-- Sparkles -->
  <polygon points="130,120 135,130 145,135 135,140 130,150 125,140 115,135 125,130" fill="#ffffff" filter="url(#glow)" />
  <polygon points="380,360 384,368 392,372 384,376 380,384 376,376 368,372 376,368" fill="#f2cc60" filter="url(#glow)" />
</svg>

    .rc-view-btn {

      font-size: 12px;

      cursor: pointer;

    .rc-view-btn:hover {

    .rc-view-btn.active {

      color: #fff;

    /* Filter Panel */
    .rc-filter-panel {

      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;

    .rc-filter-row1 {

      gap: 12px;

    }
    .rc-search-input {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      width: 280px;
      outline: none;
    }
    .rc-search-input:focus {
      border-color: #58a6ff;
    }
    .rc-btn-group {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }
    .rc-f-btn {
      background: #0d1117;
      color: #8b949e;
      border: 1px solid #30363d;
      padding: 4px 9px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .rc-f-btn:hover {
      color: #c9d1d9;
      border-color: #58a6ff;
    }
    .rc-f-btn.active {
      background: #238636;
      color: #fff;
      border-color: #2ea043;
    }

    /* Badges */
    .rc-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1.2;
      display: inline-block;
      white-space: nowrap;
    }
    .rc-badge-quad { background: #8957e522; color: #d2a8ff; border: 1px solid #8957e544; }
    .rc-badge-triple { background: #1f6feb22; color: #79c0ff; border: 1px solid #1f6feb44; }
    .rc-badge-floor { background: #23863622; color: #7ee787; border: 1px solid #23863644; }
    .rc-badge-slot { background: #388bfd22; color: #58a6ff; border: 1px solid #388bfd44; }
    .rc-badge-boss { background: #d2992222; color: #f2cc60; border: 1px solid #d2992244; }
    
    .rc-tag {
      font-size: 9px;
      font-weight: 700;
      background: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
      padding: 1px 5px;
      border-radius: 3px;
    }

    /* View 1: Relic Grid */
    .rc-relic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 8px;
    }
    .rc-relic-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.15s;
      cursor: pointer;
    }
    .rc-relic-card:hover {
      border-color: #58a6ff;
      background: #1c2128;
      transform: translateY(-1px);
    }
    .rc-relic-row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .rc-relic-num {
      font-size: 11px;
      font-weight: 900;
      color: #58a6ff;
      letter-spacing: 0.5px;
    }
    .rc-relic-name {
      font-size: 13px;
      font-weight: 800;
      color: #f0f6fc;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rc-relic-desc {
      font-size: 12px;
      color: #c9d1d9;
      line-height: 1.4;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 4px;
      padding: 6px 8px;

    .rc-relic-row3 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #8b949e;
      gap: 6px;
    }

    .rc-scar-table-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .rc-table-head {
      display: grid;
      grid-template-columns: 240px 1fr 1fr;
      gap: 12px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 800;
      color: #8b949e;
      align-items: center;
    }
    .rc-scar-row {
      display: grid;
      grid-template-columns: 240px 1fr 1fr;
      gap: 12px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px 14px;
      align-items: center;
      transition: all 0.15s;
    }
    .rc-scar-row:hover {
      border-color: #58a6ff;
      background: #1c2128;
    }
    .rc-scar-col-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .rc-scar-col-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rc-scar-title-txt {
      font-size: 13px;
      font-weight: 800;
      color: #f0f6fc;
    }
    .rc-scar-boss-txt {
      font-size: 11px;
      color: #8b949e;
    }
    .rc-scar-boss-txt strong {
      color: #f2cc60;
    }
    .rc-scar-pool-cell {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }
    .rc-chip {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 3px 7px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .rc-chip:hover {
      border-color: #58a6ff;
      background: #1f6feb22;
      transform: translateY(-1px);
    }
    .rc-chip-quad {
      border-color: rgba(210, 168, 255, 0.25);
    }
    .rc-chip-triple {
      border-color: rgba(121, 192, 255, 0.25);
    }
    .rc-empty-cell {
      font-size: 11px;
      color: #484f58;
      font-style: italic;
    }

    @media (max-width: 900px) {
      .rc-table-head {
        display: none;
      }
      .rc-scar-row {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 10px 12px;
      }
    }
    /* Modal */
    .rc-modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;

      align-items: center;

      padding: 20px;

    .rc-modal-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      max-width: 480px;
      width: 100%;
      padding: 20px;
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    }
    .rc-modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 20px;
      cursor: pointer;
    }
    .rc-modal-close:hover { color: #fff; }

    const RELICS_MAP = {};
    RELICS_DATA.forEach(r => {
      RELICS_MAP[r.id] = r;
    });

    let currentView = 'relics';
    let currentFloor = 'all';
    let currentTier = 'all';
    let currentSlot = 'all';
    let searchQuery = '';

    function switchView(view) {
      currentView = view;
      document.getElementById('btnViewRelics').classList.toggle('active', view === 'relics');
      document.getElementById('btnViewScars').classList.toggle('active', view === 'scars');
      
      document.getElementById('relicsContainer').style.display = view === 'relics' ? 'grid' : 'none';
      document.getElementById('scarsContainer').style.display = view === 'scars' ? 'grid' : 'none';
      render();
    }

    function setFloorFilter(floor) {
      currentFloor = floor;
      updateActiveBtn('#floorFilters', floor, '전체 층');
      render();
    }

    function setTierFilter(tier) {
      currentTier = tier;
      updateActiveBtn('#tierFilters', tier, '전체');
      render();
    }

    function setSlotFilter(slot) {
      currentSlot = slot;
      updateActiveBtn('#slotFilters', slot, '전체');
      render();
    }

    function updateActiveBtn(containerSelector, val, allLabel) {
      const btns = document.querySelectorAll(`${containerSelector} .rc-f-btn`);
      btns.forEach(b => {
        if (val === 'all') {
          b.classList.toggle('active', b.innerText === allLabel);
        } else {
          b.classList.toggle('active', b.innerText === val);
        }
      });
    }

    function handleFilterChange() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      render();
    }

    function render() {
      if (currentView === 'relics') {
        renderRelics();
      } else {
        renderScars();
      }
    }

    function renderRelics() {
      const container = document.getElementById('relicsContainer');
      container.innerHTML = '';

      const filtered = RELICS_DATA.filter(r => {
        if (currentFloor !== 'all' && r.floor !== currentFloor) return false;
        if (currentTier !== 'all' && r.tier_type !== currentTier) return false;
        if (currentSlot !== 'all' && r.slot_korean !== currentSlot) return false;
        if (searchQuery) {
          const allTags = (r.tags || []).join(' ');
          const str = `${r.name} ${r.number} ${r.description} ${r.source_scar} ${r.source_boss} ${allTags}`.toLowerCase();
          if (!str.includes(searchQuery)) return false;
        }
        return true;
      });

      document.getElementById('statPill').innerText = `${filtered.length}개 신물 표시 중 (전체 88종)`;

      if (filtered.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:30px; color:#8b949e;">일치하는 신물이 없습니다.</div>';
        return;
      }

      filtered.forEach(r => {
        const card = document.createElement('div');
        card.className = 'rc-relic-card';
        
        const isQuad = r.tier_type === '쿼드';
        const badgeTierClass = isQuad ? 'rc-badge-quad' : 'rc-badge-triple';
        const numDisplay = r.number ? `#${r.number}` : '신물';

        const tagsHtml = (r.tags || []).map(t => `<span class="rc-tag">${t}</span>`).join('');

        card.innerHTML = `
          <div class="rc-relic-row1">
            <span class="rc-relic-num">${numDisplay}</span>
            <span class="rc-relic-name" title="${r.name}">${r.name}</span>
            <div style="display:flex; gap:4px;">
              <span class="rc-badge rc-badge-slot">${r.slot_korean}</span>
              <span class="rc-badge ${badgeTierClass}">${r.tier_type}</span>
              <span class="rc-badge rc-badge-floor">${r.floor}</span>
            </div>
          </div>
          <div class="rc-relic-desc">
            ${r.description || '효과 정보 없음'}
          </div>
          <div class="rc-relic-row3">
            <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
              ${r.source_scar} <strong style="color:#f2cc60;">(${r.source_boss})</strong>
            </span>
            <div style="display:flex; gap:4px;">${tagsHtml}</div>
          </div>
        `;
        card.addEventListener('click', () => openRelicModal(r.id));
        container.appendChild(card);
      });
    }

    function renderScars() {
      const container = document.getElementById('scarsContainer');
      container.innerHTML = '';

      const filtered = SCARS_DATA.filter(s => {
        if (currentFloor !== 'all' && s.floor !== currentFloor) return false;
        if (searchQuery) {
          const allRelicTxt = [...s.quad_relics, ...s.triple_relics].map(r => `${r.name} ${r.number} ${r.description}`).join(' ');
          const str = `${s.scar_name} ${s.boss_name} ${s.floor} ${allRelicTxt}`.toLowerCase();
          if (!str.includes(searchQuery)) return false;
        }
        return true;
      });

      document.getElementById('statPill').innerText = `${filtered.length}개 상흔 던전 표시 중 (전체 28개)`;

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:#8b949e; background:#161b22; border-radius:6px;">일치하는 상흔이 없습니다.</div>';
        return;
      }

      // Render Table Header
      const head = document.createElement('div');
      head.className = 'rc-table-head';
      head.innerHTML = `
        <div>🏛️ 상흔 던전 / 수호 보스</div>
        <div><span class="rc-badge rc-badge-quad">쿼드</span> 보스 전용 신물</div>
        <div><span class="rc-badge rc-badge-triple">트리플</span> 상흔 특화 신물</div>
      `;
      container.appendChild(head);

      filtered.forEach(s => {
        const row = document.createElement('div');
        row.className = 'rc-scar-row';

        const quadChipsHtml = s.quad_relics.length > 0 
          ? s.quad_relics.map(r => `
              <div class="rc-chip rc-chip-quad" onclick="openRelicModal('${r.id}')" title="${r.description || ''}">
                <span style="color:#d2a8ff; font-weight:800; font-size:10px;">#${r.number}</span>
                <span style="color:#f0f6fc; font-weight:700;">${r.name}</span>
              </div>
            `).join('')
          : '<span class="rc-empty-cell">—</span>';

        const tripleChipsHtml = s.triple_relics.length > 0
          ? s.triple_relics.map(r => `
              <div class="rc-chip rc-chip-triple" onclick="openRelicModal('${r.id}')" title="${r.description || ''}">
                <span style="color:#79c0ff; font-weight:800; font-size:10px;">#${r.number}</span>
                <span style="color:#f0f6fc; font-weight:700;">${r.name}</span>
              </div>
            `).join('')
          : '<span class="rc-empty-cell">—</span>';

        row.innerHTML = `
          <div class="rc-scar-col-info">
            <div class="rc-scar-col-title">
              <span class="rc-badge rc-badge-floor">${s.floor}</span>
              <span class="rc-scar-title-txt">${s.scar_name}</span>
            </div>
            <div class="rc-scar-boss-txt">수호 보스: <strong>${s.boss_name}</strong></div>
          </div>
          <div class="rc-scar-pool-cell">
            ${quadChipsHtml}
          </div>
          <div class="rc-scar-pool-cell">
            ${tripleChipsHtml}
          </div>
        `;
        container.appendChild(row);
      });
    }

    function openRelicModal(relicId) {
      const r = RELICS_MAP[relicId];
      if (!r) return;

      const modal = document.getElementById('modalBackdrop');
      const content = document.getElementById('modalContent');

      content.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
          <div>
            <div style="font-size:12px; font-weight:800; color:#58a6ff;">신물 식별 번호: #${r.number || '-'}</div>
            <h2 style="font-size:18px; font-weight:900; color:#fff; margin:2px 0;">${r.name}</h2>
          </div>
          <div style="display:flex; gap:4px;">
            <span class="rc-badge rc-badge-slot">${r.slot_korean || '장신구'}</span>
            <span class="rc-badge ${r.tier_type === '쿼드' ? 'rc-badge-quad' : 'rc-badge-triple'}">${r.tier_type}</span>
            <span class="rc-badge rc-badge-floor">${r.floor}</span>
          </div>
        </div>
        <div style="background:#0d1117; border:1px solid #30363d; border-radius:6px; padding:12px; margin-bottom:12px;">
          <div style="font-size:11px; font-weight:700; color:#8b949e; margin-bottom:4px;">실전 장착 효과 및 옵션</div>
          <div style="font-size:13px; color:#e6edf3; line-height:1.5;">${r.description || '효과 설명이 없습니다.'}</div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:12px; color:#8b949e; background:#21262d; padding:8px 12px; border-radius:6px;">
          <div>획득처: <strong style="color:#fff;">${r.source_scar || '-'}</strong></div>
          <div>수호자: <strong style="color:#f2cc60;">${r.source_boss || '-'}</strong></div>
        </div>
      `;
      modal.style.display = 'flex';
    }

    function closeModal(e) {
      if (!e || e.target.id === 'modalBackdrop' || e.target.classList.contains('rc-modal-close')) {
        const modal = document.getElementById('modalBackdrop');
        const content = document.getElementById('modalContent');
        content.innerHTML = '';
        modal.style.display = 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      render();
    });
    render();
  </script>
</body>
</html>
